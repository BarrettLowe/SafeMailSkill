name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastmail-gatekeeper/server

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install dependencies
        run: uv venv .venv && uv pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: .venv/bin/pytest -v

  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test
    # Only push on main branch or version tags; PRs only build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitLab container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GITLAB_REGISTRY }}
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_PASSWORD }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.GITLAB_REGISTRY }}/${{ secrets.GITLAB_IMAGE_PATH }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@v6
        with:
          context: fastmail-gatekeeper
          file: fastmail-gatekeeper/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sanity:
    name: Sanity test (deployed image)
    runs-on: ubuntu-latest
    needs: build-and-push
    # Only runs on main/tag pushes where the image was actually published
    if: github.event_name != 'pull_request'

    steps:
      - name: Pull image
        run: docker pull ${{ secrets.GITLAB_REGISTRY }}/${{ secrets.GITLAB_IMAGE_PATH }}:sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Start container
        run: |
          docker run -d --name gatekeeper \
            -p 8080:8000 \
            -e FASTMAIL_TOKEN=dummy \
            -e AI_TRASH_ID=dummy \
            -e AI_OUTGOING_ID=dummy \
            -e NTFY_TOPIC=dummy \
            -e GATEKEEPER_API_KEY=sanity-key \
            -e SKIP_STARTUP_VALIDATION=1 \
            ${{ secrets.GITLAB_REGISTRY }}/${{ secrets.GITLAB_IMAGE_PATH }}:sha-$(echo ${{ github.sha }} | cut -c1-7)

      - name: Wait for container to be healthy
        run: |
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' gatekeeper 2>/dev/null || echo "starting")
            echo "Health: $STATUS (attempt $i)"
            [ "$STATUS" = "healthy" ] && break
            sleep 2
          done
          docker inspect --format='{{.State.Health.Status}}' gatekeeper | grep -q healthy

      - name: GET /health returns 200
        run: |
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'

      - name: Unauthenticated request returns 403
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/v1/jmap \
            -H "Content-Type: application/json" \
            -d '{"methodCalls":[["Mailbox/get",{},"a"]]}')
          [ "$STATUS" = "403" ]

      - name: Authenticated request reaches policy layer (Email/destroy blocked → 403)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/v1/jmap \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer sanity-key" \
            -d '{"methodCalls":[["Email/destroy",{"ids":["x"]},"a"]]}')
          [ "$STATUS" = "403" ]

      - name: Stop container
        if: always()
        run: docker rm -f gatekeeper
